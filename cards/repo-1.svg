text-anchor="middle" class="fade" style="animation-delay:4.32s">Simulation</text><g class="rise" style="animation-delay:4.39s"><rect x="192.4" y="128" width="107.8" height="24" rx="12" fill="#0f242e" stroke="#194657"/></g><text x="246.3" y="144" font-size="11" font-weight="400" fill="#9AB4BF" text-anchor="middle" class="fade" style="animation-delay:4.39s">Digital Logic</text><g class="rise" style="animation-delay:4.46s"><rect x="308.2" y="128" width="48.4" height="24" rx="12" fill="#0f242e" stroke="#194657"/></g><text x="332.4" y="144" font-size="11" font-weight="400" fill="#9AB4BF" text-anchor="middle" class="fade" style="animation-delay:4.46s">COAL</text></svg>