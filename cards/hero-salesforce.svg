<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="830" height="252" viewBox="0 0 830 252" role="img" aria-label="Abubakar Afzal: Software engineering undergrad focused on Salesforce CRM development."><title>Abubakar Afzal: Software engineering undergrad focused on Salesforce CRM development.</title><style>@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'JBM';font-weight:800;src:url(data:font/woff;base64,) format('woff')}
text{font-family:'JBM','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.flow{stroke-dasharray:3 9}
.typed{clip-path:inset(0 0 0 0)}
@keyframes cur{from{transform:translateX(-527.0px)}}
.grow,.pop,.sheen{transform-box:fill-box}
.grow{transform-origin:50% 100%}
.pop{transform-origin:50% 50%}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
.fade{animation:fade .7s ease-out backwards}
.draw{animation:draw .9s ease-out backwards}
.grow{animation:grow .8s cubic-bezier(.2,.7,.2,1) backwards}
.pop{animation:pop .4s ease-out backwards}
